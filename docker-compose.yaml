# FlashPilot 本地基础设施
#
#   docker compose up -d              只起 redis + mysql（日常开发用这个）
#   docker compose --profile obs up -d  额外起 prometheus + grafana（W3 可观测性用）
#   docker compose down -v            清掉容器和数据卷
#
# 主从 + 哨兵（W3 的 P6 故障注入实验）在 docker-compose.ha.yaml 里，单独起。
#
# ⚠ 所有端口都刻意绑在 127.0.0.1 上，不是 0.0.0.0。
#
# 原来写的是 "6379:6379"，而 Docker 的这个短写法**默认绑 0.0.0.0** ——
# 同网段任何一台机器都能直连。具体后果：
#   · Redis 没有 requirepass，任何人能 FLUSHALL 或直接改库存 key
#   · MySQL 的 root 密码是 flashpilot（仓库是公开的，等于没有密码）
#   · Grafana 是 admin/admin
#
# 这是演示环境，正确的边界是「只对本机开放」而不是「加密码」：
# 加密码要改配置、改脚本、改文档，而这里真正需要的只是别暴露出去。
# 要从别的机器访问，得改成 "0.0.0.0:6379:6379" 并**同时**配好认证。

services:
  redis:
    image: redis:7.4-alpine
    container_name: fp-redis
    ports:
      - "127.0.0.1:6379:6379"
    # noeviction: 库存 key 绝对不能被淘汰，宁可写失败也不能凭空少库存
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  mysql:
    image: mysql:8.4
    container_name: fp-mysql
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: flashpilot
      MYSQL_DATABASE: flashpilot
      TZ: Asia/Shanghai
    # 注意：下面 command 用的是 YAML 折叠标量（>），块内的 # 不是注释而是字符串内容，
    # 会被当成 mysqld 的参数传进去导致启动失败。所以说明只能写在这里，不能写在块内。
    #
    # --skip-log-bin：关掉 binlog。默认 sync_binlog=1 意味着每个事务都要给 binlog 做一次 fsync，
    #   而 Docker Desktop 的 WSL2 文件系统上 fsync 极慢 —— 实测把订单入库压到了 ~130 条/秒，
    #   而数据面能产出 3300+/秒，消费者直接成了瓶颈，一致性等式④ 永远过不去。
    #   这是纯实验库，不需要复制也不需要 PITR，binlog 是纯粹的开销。
    #   生产环境不能这么干：binlog 是主从复制和时间点恢复的基础。
    # --innodb-buffer-pool-size=2G：默认 128M，订单表加索引很快就装不下了。
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --max-connections=500
      --innodb-flush-log-at-trx-commit=2
      --skip-log-bin
      --innodb-buffer-pool-size=2G
      --innodb-log-buffer-size=64M
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pflashpilot"]
      interval: 4s
      timeout: 4s
      retries: 30

  # ---------- RocketMQ（支付超时释放的延迟消息）----------
  #
  # 为什么引入它，而不是用 Redis Stream：
  # Stream 是「扣库存 + 投递」的原子出口（XADD 写在 sell_one.lua 里，和扣租约同一条 Lua），
  # 这个原子性不能动 —— 拆开就是双写问题（扣了库存消息没发 = 少卖；发了消息没扣 = 超卖）。
  # 所以 RocketMQ 不替换它，而是承接 Stream 做不了的事：**任意时刻的定时消息**。
  #
  # 用 5.x 而不是 4.x：4.x 只有 18 个固定延迟级别（1s/5s/…/10m/20m/30m/1h/2h），
  # 而支付时限是可配的（默认 10 分钟，压测时调到 1 分钟），固定级别刚好卡不住。
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    container_name: fp-rmq-namesrv
    ports:
      - "127.0.0.1:9876:9876"
    command: sh mqnamesrv
    environment:
      # 单机演示把堆压到最小，默认配置会要 4G
      JAVA_OPT_EXT: "-server -Xms256m -Xmx256m -Xmn128m"
    healthcheck:
      # 镜像里没有 netstat / curl / nc，所以直接读 /proc/net/tcp*。
      # 9876 十进制 = 2694 十六进制，内核按十六进制列端口。
      # **必须查 tcp6**：Netty 默认绑 IPv6 的 ::，只查 tcp 会永远查不到，
      # 表现为「日志说 boot success 但容器一直 unhealthy」。
      test: ["CMD-SHELL", "grep -q ':2694' /proc/net/tcp6 /proc/net/tcp || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    container_name: fp-rmq-broker
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    ports:
      - "127.0.0.1:10911:10911"
      - "127.0.0.1:10909:10909"
    volumes:
      - ./deploy/rocketmq/broker.conf:/home/rocketmq/conf/broker.conf:ro
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/conf/broker.conf
    environment:
      JAVA_OPT_EXT: "-server -Xms512m -Xmx512m -Xmn256m"

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: fp-prometheus
    profiles: ["obs"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.5.1
    container_name: fp-grafana
    profiles: ["obs"]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      # 打开 localhost:3000 直接进控制面板，不用先看那页「Welcome to Grafana」教程。
      # 路径是容器内的路径 —— provisioning 目录挂在 /etc/grafana/provisioning，
      # 所以 dashboard JSON 在容器里的位置是这个，不是宿主机的 deploy/。
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/flashpilot.json
    volumes:
      - ./deploy/grafana:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

volumes:
  redis-data:
  mysql-data:
  grafana-data:
