brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# ⚠ Docker 里跑 RocketMQ 的经典坑：
# broker 启动时会把自己的**容器内网 IP**（172.x.x.x）注册到 namesrv，
# 客户端从 namesrv 拿到的是那个地址，于是宿主机上的应用连不上 ——
# 表现为「namesrv 连得上、发消息超时」，而日志里只说 sendDefaultImpl call timeout。
# 必须显式告诉 broker 用哪个地址对外宣告。
brokerIP1 = 127.0.0.1

# 单机演示：一个 topic 自动创建、队列数少一点，省内存
autoCreateTopicEnable = true
defaultTopicQueueNums = 4

# 5.x 的定时消息（任意时刻投递，不是 4.x 那 18 个固定延迟级别）。
# 支付时限是可配的（默认 10 分钟，压测时会调到 1 分钟），
# 固定级别刚好卡不住这个需求 —— 这也是选 5.x 的原因。
timerWheelEnable = true
messageDelayLevel = 1s 5s 10s 30s 1m 2m 3m 4m 5m 6m 7m 8m 9m 10m 20m 30m 1h 2h
